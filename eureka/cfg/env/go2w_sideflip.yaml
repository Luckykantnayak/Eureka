task: Go2wSideflip
env_name: go2w_sideflip
description: >
  Control the Go2w robot to perform a dynamic side flip conditioned on the commanded forward velocity.
  When the commanded forward velocity vx is strictly positive, the robot should execute a single lateral
  side flip in place by rotating primarily about its body x-axis (roll), lifting all feet and wheels off
  the ground briefly, completing approximately one full rotation, and landing stably without falling.
  The robot should not translate significantly during the flip.

  When the commanded forward velocity vx is zero or negative, the robot should remain idle in a stable,
  seated posture with minimal base motion, low joint velocities, and low actuation effort.

  The robot should ignore vy and yaw commands. Stability after landing, controlled angular motion,
  limited base translation, and low unnecessary torque are desired.





max_iterations: 3000
